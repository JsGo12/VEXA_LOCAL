# Linter del backend (ruff). Desde la carpeta Codigo:
#   .\.venv\Scripts\python.exe -m ruff check backend
# Solo reglas que detectan errores reales o código muerto; el estilo de líneas no se revisa.
target-version = "py312"
line-length = 120
extend-exclude = ["desktop/electron/node_modules"]

[lint]
select = [
    "F",      # pyflakes: imports y variables sin uso, nombres indefinidos
    "E9",     # errores de sintaxis
    "B",      # bugbear: errores frecuentes (excepciones demasiado amplias, zip sin strict...)
    "C4",     # comprensiones innecesarias
    "PIE",    # código redundante
    "I",      # orden de los imports (stdlib, terceros, vexa)
    "UP006", "UP007", "UP012", "UP017", "UP035", "UP037", "UP045",  # tipos nativos y otras modernizaciones
]

[lint.isort]
known-first-party = ["vexa", "helpers"]
